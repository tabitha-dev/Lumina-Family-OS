name: Import Lumina OpenArt illustration
on:
  push:
    branches: [feature/responsive-family-refresh-20261029]
    paths:
      - scripts/import_lumina_hero.py
      - .github/workflows/import-lumina-hero.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python scripts/import_lumina_hero.py
      - name: Check inline script syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const s=html.match(/<script>\s*([\s\S]*?)<\/script>/g)||[];
          for(const script of s){const src=script.replace(/^<script>/,'').replace(/<\/script>$/,'');new Function(src);}
          if(html.includes('71e3466119')||html.includes('x-rapidapi-key'))throw Error('Legacy browser-visible credential present');
          console.log('JavaScript syntax and credential scan passed');
          NODE
      - name: Commit asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lumina-hero.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Store optimized Lumina illustration locally'
            git push origin HEAD:feature/responsive-family-refresh-20261029
          fi
